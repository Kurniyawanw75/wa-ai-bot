services:
  - type: web
    name: wa-qwen-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        sync: false
      - key: QWEN_MODEL
        value: qwen3.8-max
      - key: AUTO_REPLY
        value: "false"
      - key: SYSTEM_PROMPT
        value: "Kamu adalah asisten AI WhatsApp yang ramah. Jawab dalam bahasa Indonesia, santai, singkat, dan membantu."
