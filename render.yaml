services:
  - type: web
    name: wa-ai-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODEL
        value: qwen/qwen3.8-27b:free
      - key: AUTO_REPLY
        value: "false"
      - key: SYSTEM_PROMPT
        value: "Kamu adalah asisten AI WhatsApp yang ramah. Jawab dalam bahasa Indonesia, santai, singkat, dan membantu."
